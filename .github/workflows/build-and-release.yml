name: Build & Release APK

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Node.js dependencies
        run: npm ci --prefer-offline

      - name: Compile TypeScript
        run: npm run build

      - name: Bundle frontend
        working-directory: products/theia-android-lite
        run: npm run bundle

      - name: Download proot binary
        run: |
          mkdir -p runtime/bin/android-aarch64
          curl -fsSL https://skirsten.github.io/proot-portable-android-binaries/aarch64/proot -o runtime/bin/android-aarch64/proot
          chmod +x runtime/bin/android-aarch64/proot

      - name: Assemble runtime assets
        run: node products/theia-android-lite/scripts/build-runtime-assets.mjs

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build Debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: devpocket-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-apk
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: devpocket-debug-apk

      - name: Generate release metadata
        id: release-info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S')
          VERSION="dev-${TIMESTAMP}-${SHORT_SHA}"
          APK_NAME="DevPocket-${VERSION}.apk"
          mv app-debug.apk "$APK_NAME"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges -20)
          fi
          cat > RELEASE_NOTES.md << EOF
          ## DevPocket Build ${{ steps.release-info.outputs.version }}

          **Built:** ${{ steps.release-info.outputs.timestamp }} UTC
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ### Recent Changes
          $COMMITS

          ### Installation
          1. Download the APK below
          2. Enable "Install from Unknown Sources" on your Android device
          3. Install and launch DevPocket

          ### Notes
          - This is an automated debug build
          - Includes latest Debian environment fixes (bullseye sources.list)
          - Real PTY terminal support via node-pty
          - Git/SSL/npm support bundled
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.version }}
          name: "DevPocket ${{ steps.release-info.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: ${{ steps.release-info.outputs.apk_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
